<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Slingshot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#83cffa;touch-action:none;user-select:none;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.panel{padding:10px 13px;background:rgba(255,255,255,.94);border-radius:12px;color:#25364a;font-weight:bold;font-size:14px}
button{pointer-events:auto;background:#ff7043;color:#fff;border:0;padding:11px 15px;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
#hint{position:absolute;bottom:18px;left:12px;right:12px;text-align:center;color:#fff;font-weight:bold;font-size:14px;text-shadow:0 2px 5px #333;pointer-events:none}
#overlay{display:none;position:absolute;inset:0;z-index:10;background:rgba(12,30,45,.35);align-items:center;justify-content:center;padding:20px}
#overlayCard{background:#fff;border-radius:20px;padding:24px;text-align:center;max-width:340px;width:100%}
#overlayTitle{font-size:25px;color:#25364a;margin-bottom:10px}
#overlayText{color:#526273;margin-bottom:18px}
.screen{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#8fd4ff,#d9f4ff 65%,#b7ecb0)}
.screen.show{display:flex}
.card{background:rgba(255,255,255,.96);border-radius:24px;padding:26px 22px;max-width:420px;width:100%;text-align:center;max-height:calc(100dvh - 36px);display:flex;flex-direction:column}
.menu-logo{font-size:48px;margin-bottom:6px}
.menu-title{font-size:28px;color:#25364a;font-weight:900;margin-bottom:4px}
.menu-sub{color:#6c7d90;font-weight:bold;margin-bottom:16px;font-size:14px}
.menu-coins,.shop-coins{display:inline-flex;gap:6px;background:#fff7d6;border:2px solid #ffd54f;color:#a8720b;font-weight:900;border-radius:14px;padding:8px 16px;font-size:17px}
.menu-coins{margin-bottom:18px;align-self:center}
.menu-buttons{display:flex;flex-direction:column;gap:11px}
.btn-primary{background:linear-gradient(180deg,#ff8a5c,#ff5f34);font-size:19px;padding:16px}
.btn-secondary{background:linear-gradient(180deg,#57bdf1,#2f9ad6);font-size:17px;padding:14px}
.btn-ghost{background:#e8eef4;color:#3d4d5e;font-size:15px;padding:12px}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.shop-head h2{font-size:21px;color:#25364a}
.shop-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.shop-tab{background:#e8eef4;color:#3d4d5e;padding:8px 10px;font-size:12.5px;border-radius:10px;flex:1;min-width:70px}
.shop-tab.active{background:#25364a;color:#fff}
.shop-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;overflow-y:auto;padding:2px;margin-bottom:14px;flex:1;min-height:120px}
.shop-item{background:#f4f8fc;border:2px solid #dce7f0;border-radius:14px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-item.selected{border-color:#3ec44c;background:#eefbf0}
.shop-swatch{width:100%;height:44px;border-radius:10px;border:1px solid #0002;display:flex;align-items:center;justify-content:center;overflow:hidden}
.shop-name{font-size:12.5px;font-weight:bold;color:#25364a}
.shop-buy{font-size:12px;padding:7px 10px;border-radius:9px;width:100%}
.shop-buy.owned{background:#cfe9d2;color:#2c7a34}
.shop-buy.equipped{background:#3ec44c}
.shop-buy.locked{background:#ffb300}
</style>
</head>
<body>
<div id="game">
<div id="ui">
<div class="stats">
<div class="panel">🪙 <span id="coins">0</span></div>
<div class="panel">⭐ <span id="score">0</span></div>
<div class="panel">Ур: <span id="level">1</span></div>
<div class="panel">🐦 <span id="birdQueue"></span></div>
</div>
<button id="restart">↻</button>
</div>
<canvas id="canvas"></canvas>
<div id="hint">Оттяни и отпусти!</div>
<div id="overlay">
<div id="overlayCard">
<div id="overlayTitle"></div>
<div id="overlayText"></div>
<button id="overlayButton">Далее</button>
</div>
</div>
<div id="menuScreen" class="screen show">
<div class="card">
<div class="menu-logo">🐦🎯</div>
<div class="menu-title">SLINGSHOT</div>
<div class="menu-sub">Рогатка · Свинки · Скины</div>
<div class="menu-coins">🪙 <span id="menuCoins">0</span></div>
<div class="menu-buttons">
<button id="playBtn" class="btn-primary">▶ Играть</button>
<button id="shopBtn" class="btn-secondary">🛒 Магазин</button>
</div>
</div>
</div>
<div id="shopScreen" class="screen">
<div class="card">
<div class="shop-head"><h2>Магазин</h2><div class="shop-coins">🪙 <span id="shopCoins">0</span></div></div>
<div class="shop-tabs" id="shopTabs">

<button class="shop-tab" data-tab="pig">Свиньи</button>
<button class="shop-tab" data-tab="bird">Птицы</button>
<button class="shop-tab" data-tab="sling">Рогатка</button>
</div>
<div class="shop-list" id="shopList"></div>
<button id="shopBack" class="btn-ghost">← Назад</button>
</div>
</div>
</div>

function wake(b){if(!b||b.isStatic)return;b.sleeping=false;b.sleepTime=0;}
function cC(a,b){
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.radius+b.radius;
  if(d>=m||d<0.0001)return null;
  return {nx:dx/d,ny:dy/d,depth:m-d};
}
function rR(a,b){
  var dx=b.x-a.x,dy=b.y-a.y;
  var ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);
  if(ox<=0||oy<=0)return null;
  return ox<oy?{nx:dx>=0?1:-1,ny:0,depth:ox}:{nx:0,ny:dy>=0?1:-1,depth:oy};
}
function cR(c,r){
  var l=r.x-r.w/2,rt=r.x+r.w/2,t=r.y-r.h/2,b=r.y+r.h/2;
  var px=Math.max(l,Math.min(rt,c.x)),py=Math.max(t,Math.min(b,c.y));
  var dx=c.x-px,dy=c.y-py,d=Math.hypot(dx,dy);
  if(d>=c.radius)return null;
  if(d<0.0001){
    var toL=c.x-l,toR=rt-c.x,toT=c.y-t,toB=b-c.y,m=Math.min(toL,toR,toT,toB);
    if(m===toL)return{nx:1,ny:0,depth:c.radius+toL};
    if(m===toR)return{nx:-1,ny:0,depth:c.radius+toR};
    if(m===toT)return{nx:0,ny:1,depth:c.radius+toT};
    return{nx:0,ny:-1,depth:c.radius+toB};
  }
  return{nx:-dx/d,ny:-dy/d,depth:c.radius-d};
}
function getCol(a,b){
  if(a.radius&&b.radius)return cC(a,b);
  if(!a.radius&&!b.radius)return rR(a,b);
  if(a.radius)return cR(a,b);
  var h=cR(b,a);
  if(h){h.nx*=-1;h.ny*=-1;}
  return h;
}
function burst(x,y,color,count,kind){

  }

function breakBlock(b){
  if(!b.alive)return;

function killTarget(t){

function resolve(a,b,h){
  var nx=h.nx,ny=h.ny;
  var sA=Math.hypot(a.vx,a.vy),sB=Math.hypot(b.vx,b.vy);
  if(a.sleeping&&sB>20)wake(a);
  if(b.sleeping&&sA>20)wake(b);
  var ia=(a.isStatic||a.sleeping)?0:1/a.mass,ib=(b.isStatic||b.sleeping)?0:1/b.mass;
  var sum=ia+ib;
  if(!sum)return;
  var corr=Math.max(h.depth-0.25,0)*0.78/sum;
  if(ia){a.x-=nx*corr*ia;a.y-=ny*corr*ia;}
  if(ib){b.x+=nx*corr*ib;b.y+=ny*corr*ib;}
  var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
  if(vn>=0)return;
  var e=Math.abs(vn)<35?0:Math.min(a.restitution,b.restitution);
  var j=-(1+e)*vn/sum,ix=j*nx,iy=j*ny;
  if(ia){a.vx-=ix*ia;a.vy-=iy*ia;}
  if(ib){b.vx+=ix*ib;b.vy+=iy*ib;}
  var tx0=rvx-vn*nx,ty0=rvy-vn*ny,tl=Math.hypot(tx0,ty0);
  if(tl>0.001){
    var tx=tx0/tl,ty=ty0/tl;
    var jt=-(rvx*tx+rvy*ty)/sum;
    var mu=Math.sqrt(a.friction*b.friction);
    var fj=Math.max(-j*mu,Math.min(j*mu,jt));
    if(ia){a.vx-=fj*tx*ia;a.vy-=fj*ty*ia;}
    if(ib){b.vx+=fj*tx*ib;b.vy+=fj*ty*ib;}
  }
  var imp=Math.abs(vn);
  var hb=(a.type==="projectile"&&b.type==="block")||(b.type==="projectile"&&a.type==="block");
  if(hb&&launched&&imp>28){
    if(a.type==="block")breakBlock(a);
    if(b.type==="block")breakBlock(b);
    SFX.hit();
  }
  if(imp>95){
    if(a.type==="target")killTarget(a);
    if(b.type==="target")killTarget(b);
  }
  if(imp>25){wake(a);wake(b);}
}
  function ground(b){
  var bt=b.radius?b.y+b.radius:b.y+b.h/2;
  if(bt<=groundY)return;
  b.y-=bt-groundY;
  if(b.vy>0)b.vy=-b.vy*b.restitution;
  b.vx*=0.94;
  if(Math.abs(b.vy)<22)b.vy=0;
  if(Math.abs(b.vx)<3)b.vx=0;
}
function sleepSys(b,dt){
  if(b.isStatic||(b===projectile&&dragging))return;
  var s=Math.hypot(b.vx,b.vy);
  if(s<8&&Math.abs(b.vy)<7){
    b.sleepTime+=dt;
    if(b.sleepTime>0.7){b.sleeping=true;b.vx=0;b.vy=0;}
  }else{
    b.sleepTime=0;b.sleeping=false;
  }
}
function physics(dt){
  var i,p;
  for(i=particles.length-1;i>=0;i--){
    p=particles[i];
    p.life-=dt;
    p.vy+=GRAVITY*.45*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    if(p.kind==="wood"){p.rotation+=p.spin*dt;p.vx*=.995;}
    if(p.life<=0)particles.splice(i,1);
  }
  for(i=0;i<bodies.length;i++){
    var b=bodies[i];
    if(!b.alive||b.isStatic||b.sleeping)continue;
    if(b===projectile&&dragging)continue;
    b.vy+=GRAVITY*dt;
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    b.vx*=0.999;
    b.vy*=0.999;
  }
  for(var k=0;k<SOLVER_ITERATIONS;k++){
    for(var a1=0;a1<bodies.length;a1++){
      var A=bodies[a1];
      if(!A.alive)continue;
      ground(A);
      for(var b1=a1+1;b1<bodies.length;b1++){
        var B=bodies[b1];
        if(!B.alive)continue;
        if(A===projectile&&dragging||B===projectile&&dragging)continue;
        if(A.sleeping&&B.sleeping)continue;
        var hit=getCol(A,B);
        if(hit)resolve(A,B,hit);
      }
    }
  }
  for(i=0;i<bodies.length;i++){
    var b2=bodies[i];
    if(!b2.alive)continue;
    ground(b2);
    sleepSys(b2,dt);
    if(b2.y>H+120||b2.y<-150||b2.x<-150||b2.x>W+250){
      if(b2.type==="target")killTarget(b2);
      else b2.alive=false;
    }
  }
  bodies=bodies.filter(function(b){return b.alive;});
  if(launched&&projectile&&projectile.alive){
    var sp=Math.hypot(projectile.vx,projectile.vy);
    var off=projectile.y<-50||projectile.x>W+100||projectile.x<-100;
    if(sp<16||off)projectileStopTime+=dt;
    else projectileStopTime=0;
    if(projectileStopTime>0.5){
      projectile.alive=false;
      projectile=null;
      launched=false;
      projectileStopTime=0;
      var remT=bodies.some(function(b){return b.type==="target";});
      if(attempts>0&&remT){
        createProjectile();
        hintEl.textContent="Следующая птица готова!";
      }
    }
  }
  checkLevel();
}
function checkLevel(){
  if(overlay.style.display==="flex")return;
  var rem=bodies.some(function(b){return b.alive&&b.type==="target";});
  if(!rem){
    launched=false;
    dragging=false;
    var bonus=15;
    addCoins(bonus);
    hintEl.textContent="Уровень пройден!";
    overlayTitle.textContent="🏆 Победа!";
    overlayText.textContent="Уровень "+level+" пройден. +"+bonus+" монет!";
    overlayButton.textContent="Следующий уровень";
    overlay.style.display="flex";
    SFX.win();
    overlayButton.onclick=function(){
      overlay.style.display="none";
      level++;
      createLevel(false);
    };
    return;
  }
  if(attempts<=0&&!launched&&!dragging){
    overlayTitle.textContent="Попытки закончились";
    overlayText.textContent="Уровень "+level+" не пройден.";
    overlayButton.textContent="Повторить";
    overlay.style.display="flex";
    SFX.fail();

      createLevel(false);
    };
  }
}

    ctx.beginPath();ctx.arc(-4,-1,1.3,0,Math.PI*2);ctx.arc(6,-1,1.3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=s.beak||"#ffb300";
    ctx.beginPath();ctx.moveTo(-2,3);ctx.lineTo(5,3);ctx.lineTo(1,8);ctx.closePath();ctx.fill();
  }else if(s.model==="robot"){
    var gg=ctx.createLinearGradient(-b.radius,-b.radius,b.radius,b.radius);
    gg.addColorStop(0,"#dde4ea");gg.addColorStop(1,s.color);
    ctx.fillStyle=gg;
    ctx.beginPath();ctx.arc(0,0,b.radius,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#3a4a5a";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#22303a";ctx.fillRect(-9,-5,18,8);
    ctx.fillStyle="#4ac6ff";
    ctx.beginPath();ctx.arc(-4,-1,2.2,0,Math.PI*2);ctx.arc(4,-1,2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=s.beak||"#ff6a3d";
    ctx.beginPath();ctx.moveTo(-2,4);ctx.lineTo(5,4);ctx.lineTo(1,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#3a4a5a";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,-b.radius);ctx.lineTo(0,-b.radius-4);ctx.stroke();
    ctx.fillStyle="#4ac6ff";
    ctx.beginPath();ctx.arc(0,-b.radius-5,2,0,Math.PI*2);ctx.fill();
  }else if(s.model==="phoenix"){
    ctx.fillStyle=s.crest||"#ffd23f";
    for(var i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(-5+i*3,-11);
      ctx.lineTo(-8+i*5,-22-i*2);
      ctx.lineTo(-3+i*3,-13);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle="#ffd27a";
    ctx.beginPath();ctx.ellipse(0,5,6.5,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=s.beak||"#ffe08a";
    ctx.beginPath();ctx.moveTo(-2,2);ctx.lineTo(6,2);ctx.lineTo(2,10);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(-5,-2,4,0,Math.PI*2);ctx.arc(5,-2,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ff5a1a";
    ctx.beginPath();ctx.arc(-4,-1,1.8,0,Math.PI*2);ctx.arc(6,-1,1.8,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawTraj(){
  if(!dragging||!projectile)return;
  var dx=sling.x-projectile.x,dy=sling.y-projectile.y;
  var pl=Math.hypot(dx,dy),r=Math.min(pl/MAX_PULL,1),pw=1+r*.65;
  var vx=dx*POWER*pw,vy=dy*POWER*pw;
  ctx.save();
  ctx.setLineDash([3,8]);
  ctx.lineWidth=2.5;
  ctx.strokeStyle="rgba(255,255,255,.92)";
  ctx.beginPath();
  var started=false;
  for(var t=.06;t<=1.45;t+=.09){
    var x=projectile.x+vx*t;
    var y=projectile.y+vy*t+.5*GRAVITY*t*t;
    if(y>groundY-10||x>W+20)break;
    if(!started){ctx.moveTo(x,y);started=true;}
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawPart(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    if(p.kind==="wood"){
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rotation);
      ctx.fillRect(-p.size*1.5,-p.size*.55,p.size*3,p.size*1.1);
      ctx.restore();
    }else{
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBG();
  drawSling();
  drawTraj();
  for(var i=0;i<bodies.length;i++){
    var b=bodies[i];
    if(!b.alive||b===projectile)continue;
    if(b.type==="target")drawPig(b);
    else drawBlock(b);
  }
  if(projectile&&projectile.alive)drawBird(projectile);
  drawPart();
}
function loop(ts){
  if(!lastTime)lastTime=ts;
  var ft=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;
  accumulator+=ft;
  var st=0;
  while(accumulator>=FIXED_DT&&st<MAX_STEPS){
    physics(FIXED_DT);
    accumulator-=FIXED_DT;
    st++;
  }
  if(st===MAX_STEPS)accumulator=Math.min(accumulator,FIXED_DT);
  if(!inMenu)draw();
  requestAnimationFrame(loop);
}
function openGame(){
  inMenu=false;
  menuScreen.classList.remove("show");
  shopScreen.classList.remove("show");
  resize();
  createLevel(true);
}
function openMenu(){
  inMenu=true;
  menuScreen.classList.add("show");
  shopScreen.classList.remove("show");
  syncCoinsUI();
}
function drawPigPreview(c,s){
  c.save();
  c.fillStyle=s.color;c.strokeStyle=s.eye;c.lineWidth=2;
  c.beginPath();c.arc(0,0,16,0,Math.PI*2);c.fill();c.stroke();
  if(s.model==="king"){
    c.fillStyle="#ffcf3f";
    c.beginPath();
    c.moveTo(-11,-11);c.lineTo(-8,-20);c.lineTo(-4,-12);c.lineTo(0,-22);c.lineTo(4,-12);c.lineTo(8,-20);c.lineTo(11,-11);c.closePath();c.fill();
  }
  if(s.model==="ninja"){c.fillStyle="#1a1a1a";c.fillRect(-16,-2,32,6);}
  if(s.model==="robot"){
    c.fillStyle="#22303a";c.fillRect(-10,-4,20,7);
    c.fillStyle="#4ac6ff";
    c.beginPath();c.arc(-4,0,2,0,Math.PI*2);c.arc(4,0,2,0,Math.PI*2);c.fill();
  }
  c.fillStyle="#fff";
  c.beginPath();c.arc(-5,-3,3,0,Math.PI*2);c.arc(5,-3,3,0,Math.PI*2);c.fill();
  c.fillStyle=s.eye;
  c.beginPath();c.arc(-4,-2,1.4,0,Math.PI*2);c.arc(6,-2,1.4,0,Math.PI*2);c.fill();
  c.fillStyle="#f28c9a";
  c.beginPath();c.ellipse(0,7,6,4,0,0,Math.PI*2);c.fill();
  c.restore();
}
function drawBirdPreview(c,s){
  c.save();
  c.fillStyle=s.color2;
  c.beginPath();
  c.moveTo(-11,4);c.lineTo(-22,-1);c.lineTo(-17,9);c.lineTo(-24,12);c.lineTo(-10,14);c.closePath();
  c.fill();
  var g=c.createRadialGradient(-5,-8,2,0,0,16);
  g.addColorStop(0,s.belly);
  g.addColorStop(.55,s.color);
  g.addColorStop(1,s.color2);
  c.fillStyle=g;
  c.beginPath();c.arc(0,0,15,0,Math.PI*2);c.fill();
  c.strokeStyle=s.color2;c.lineWidth=2;c.stroke();
  c.fillStyle=s.crest||"#ffd54f";
  c.beginPath();c.moveTo(-4,-13);c.quadraticCurveTo(-10,-24,-2,-21);c.quadraticCurveTo(0,-18,1,-14);c.closePath();c.fill();
  c.fillStyle=s.beak||"#ffb300";
  c.beginPath();c.moveTo(-2,2);c.lineTo(5,2);c.lineTo(1,9);c.closePath();c.fill();
  c.fillStyle="#fff";
  c.beginPath();c.arc(-5,-3,4,0,Math.PI*2);c.arc(5,-3,4,0,Math.PI*2);c.fill();
  c.fillStyle="#251d1b";
  c.beginPath();c.arc(-4,-2,2,0,Math.PI*2);c.arc(6,-2,2,0,Math.PI*2);c.fill();
  c.restore();
}
function drawSlingPreview(c,s){
  c.save();
  c.lineCap="round";
  c.strokeStyle=s.color2;c.lineWidth=10;
  c.beginPath();
  c.moveTo(0,18);
  c.bezierCurveTo(-5,8,-8,0,-14,-14);
  c.moveTo(0,18);
  c.bezierCurveTo(5,8,8,0,14,-14);
  c.stroke();
  c.strokeStyle=s.color3;c.lineWidth=11;
  c.beginPath();c.moveTo(0,15);c.quadraticCurveTo(-3,5,0,-2);c.stroke();
  c.fillStyle=s.color;
  c.beginPath();c.arc(-14,-14,4,0,Math.PI*2);c.arc(14,-14,4,0,Math.PI*2);c.fill();
  c.restore();
}
function renderShop(tab){
  shopListEl.innerHTML="";
  for(var i=0;i<SKINS[tab].length;i++){
    var s=SKINS[tab][i];
    var owned=save.unlocked[tab].indexOf(s.id)>=0;
    var active=save.active[tab]===s.id;
    var div=document.createElement("div");
    div.className="shop-item"+(active?" selected":"");
    var sw=document.createElement("div");
    sw.className="shop-swatch";
    var cv=document.createElement("canvas");
    cv.width=80;cv.height=44;
    cv.style.width="100%";cv.style.height="100%";
    var c2=cv.getContext("2d");
    c2.translate(40,22);
    if(tab==="bg"){
      var gr=c2.createLinearGradient(0,-22,0,22);
      gr.addColorStop(0,s.colors[0]);
      gr.addColorStop(1,s.colors[1]);
      c2.fillStyle=gr;c2.fillRect(-40,-22,80,44);
      c2.fillStyle=s.ground;c2.fillRect(-40,14,80,8);
    }else if(tab==="pig"){
      var oldP=save.active.pig;save.active.pig=s.id;
      drawPigPreview(c2,s);
      save.active.pig=oldP;
    }else if(tab==="bird"){
      var oldB=save.active.bird;save.active.bird=s.id;
      drawBirdPreview(c2,s);
      save.active.bird=oldB;
    }else{
      var oldS=save.active.sling;save.active.sling=s.id;
      drawSlingPreview(c2,s);
      save.active.sling=oldS;
    }
    sw.appendChild(cv);
    var nm=document.createElement("div");
    nm.className="shop-name";
    nm.textContent=s.name;
    var btn=document.createElement("button");
    btn.className="shop-buy "+(active?"equipped":owned?"owned":"locked");
    btn.textContent=active?"✓ Выбрано":owned?"Выбрать":s.price+" 🪙";
    btn.disabled=active;
    btn.onclick=(function(sc,cat){
      return function(){
        if(save.unlocked[cat].indexOf(sc.id)<0){
          if(save.coins<sc.price){alert("Недостаточно монет!");return;}
          save.coins-=sc.price;
          save.unlocked[cat].push(sc.id);
          SFX.buy();
        }
        save.active[cat]=sc.id;
        persistSave();
        syncCoinsUI();
        renderShop(cat);
        if(!inMenu)createLevel(false);
      };
    })(s,tab);
    div.appendChild(sw);
    div.appendChild(nm);
    div.appendChild(btn);
    shopListEl.appendChild(div);
  }
}
shopTabsEl.onclick=function(e){
  var b=e.target.closest(".shop-tab");
  if(!b)return;
  SFX.click();
  var tabs=shopTabsEl.querySelectorAll(".shop-tab");
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove("active");
  b.classList.add("active");
  renderShop(b.getAttribute("data-tab"));
};
playBtn.onclick=function(){SFX.click();ensureAudio();openGame();};
shopBtn.onclick=function(){SFX.click();menuScreen.classList.remove("show");shopScreen.classList.add("show");renderShop("bg");syncCoinsUI();};
shopBack.onclick=function(){SFX.click();shopScreen.classList.remove("show");menuScreen.classList.add("show");syncCoinsUI();};
restartBtn.onclick=function(){SFX.click();level=1;if(inMenu)openGame();else createLevel(true);};
canvas.addEventListener("pointerdown",function(e){
  ensureAudio();
  if(!projectile||launched||overlay.style.display==="flex")return;
  var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(Math.hypot(x-projectile.x,y-projectile.y)<Math.max(50,projectile.radius+26)){
    dragging=true;
    pointerId=e.pointerId;
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  }
});
canvas.addEventListener("pointermove",function(e){
  if(!dragging||!projectile||e.pointerId!==pointerId)return;
  var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  var dx=x-sling.x,dy=y-sling.y;
  var md=Math.min(MAX_PULL,W*.35),d=Math.hypot(dx,dy);
  if(d>md){dx*=md/d;dy*=md/d;}
  dx=Math.min(dx,10);
  projectile.x=sling.x+dx;
  projectile.y=sling.y+dy;
  projectile.vx=0;projectile.vy=0;
});
canvas.addEventListener("pointerup",function(e){
  if(e.pointerId!==pointerId||!dragging||!projectile)return;
  dragging=false;
  pointerId=null;
  var dx=sling.x-projectile.x,dy=sling.y-projectile.y;
  var d=Math.hypot(dx,dy),r=Math.min(d/MAX_PULL,1),m=1+r*.65;
  projectile.vx=dx*POWER*m;
  projectile.vy=dy*POWER*m;
  launched=true;
  projectileStopTime=0;
  attempts=Math.max(0,attempts-1);
  updateUI();
  hintEl.textContent="Попади по всем целям!";
  SFX.launch();
});
canvas.addEventListener("pointercancel",function(e){
  if(e.pointerId===pointerId){dragging=false;pointerId=null;}
});
window.addEventListener("resize",resize);
if(window.Telegram&&window.Telegram.WebApp){
  var tg=window.Telegram.WebApp;
  tg.ready();tg.expand();
  if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();
}
loadSave();
syncCoinsUI();
resize();
requestAnimationFrame(loop);
})();
</script>
