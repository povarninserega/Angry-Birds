<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Slingshot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#83cffa;touch-action:none;user-select:none;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.panel{padding:10px 13px;background:rgba(255,255,255,.94);border-radius:12px;color:#25364a;font-weight:bold;font-size:14px}
button{pointer-events:auto;background:#ff7043;color:#fff;border:0;padding:11px 15px;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
#hint{position:absolute;bottom:18px;left:12px;right:12px;text-align:center;color:#fff;font-weight:bold;font-size:14px;text-shadow:0 2px 5px #333;pointer-events:none}
#overlay{display:none;position:absolute;inset:0;z-index:10;background:rgba(12,30,45,.35);align-items:center;justify-content:center;padding:20px}
#overlayCard{background:#fff;border-radius:20px;padding:24px;text-align:center;max-width:340px;width:100%}
#overlayTitle{font-size:25px;color:#25364a;margin-bottom:10px}
#overlayText{color:#526273;margin-bottom:18px}
.screen{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#8fd4ff,#d9f4ff 65%,#b7ecb0)}
.screen.show{display:flex}
.card{background:rgba(255,255,255,.96);border-radius:24px;padding:26px 22px;max-width:420px;width:100%;text-align:center;max-height:calc(100dvh - 36px);display:flex;flex-direction:column}
.menu-logo{font-size:48px;margin-bottom:6px}
.menu-title{font-size:28px;color:#25364a;font-weight:900;margin-bottom:4px}
.menu-sub{color:#6c7d90;font-weight:bold;margin-bottom:16px;font-size:14px}
.menu-coins,.shop-coins{display:inline-flex;gap:6px;background:#fff7d6;border:2px solid #ffd54f;color:#a8720b;font-weight:900;border-radius:14px;padding:8px 16px;font-size:17px}
.menu-coins{margin-bottom:18px;align-self:center}
.menu-buttons{display:flex;flex-direction:column;gap:11px}
.btn-primary{background:linear-gradient(180deg,#ff8a5c,#ff5f34);font-size:19px;padding:16px}
.btn-secondary{background:linear-gradient(180deg,#57bdf1,#2f9ad6);font-size:17px;padding:14px}
.btn-ghost{background:#e8eef4;color:#3d4d5e;font-size:15px;padding:12px}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.shop-head h2{font-size:21px;color:#25364a}
.shop-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.shop-tab{background:#e8eef4;color:#3d4d5e;padding:8px 10px;font-size:12.5px;border-radius:10px;flex:1;min-width:70px}
.shop-tab.active{background:#25364a;color:#fff}
.shop-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;overflow-y:auto;padding:2px;margin-bottom:14px;flex:1;min-height:120px}
.shop-item{background:#f4f8fc;border:2px solid #dce7f0;border-radius:14px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-item.selected{border-color:#3ec44c;background:#eefbf0}
.shop-swatch{width:100%;height:44px;border-radius:10px;border:1px solid #0002;display:flex;align-items:center;justify-content:center;font-size:24px}
.shop-name{font-size:12.5px;font-weight:bold;color:#25364a}
.shop-buy{font-size:12px;padding:7px 10px;border-radius:9px;width:100%}
.shop-buy.owned{background:#cfe9d2;color:#2c7a34}
.shop-buy.equipped{background:#3ec44c}
.shop-buy.locked{background:#ffb300}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div class="stats">
<div class="panel">🪙 <span id="coins">0</span></div>
<div class="panel">⭐ <span id="score">0</span></div>
<div class="panel">Ур: <span id="level">1</span></div>
<div class="panel">🐦 <span id="birdQueue"></span></div>
</div><button id="restart">↻</button></div>
<canvas id="canvas"></canvas>
<div id="hint">Оттяни и отпусти!</div>
<div id="overlay"><div id="overlayCard"><div id="overlayTitle"></div><div id="overlayText"></div><button id="overlayButton">Далее</button></div></div>
<div id="menuScreen" class="screen show"><div class="card">
<div class="menu-logo">🐦🎯</div>
<div class="menu-title">SLINGSHOT</div>
<div class="menu-sub">Рогатка · Свинки · Скины</div>
<div class="menu-coins">🪙 <span id="menuCoins">0</span></div>
<div class="menu-buttons">
<button id="playBtn" class="btn-primary">▶ Играть</button>
<button id="shopBtn" class="btn-secondary">🛒 Магазин</button>
</div></div></div>
<div id="shopScreen" class="screen"><div class="card">
<div class="shop-head"><h2>Магазин</h2><div class="shop-coins">🪙 <span id="shopCoins">0</span></div></div>
<div class="shop-tabs" id="shopTabs">
<button class="shop-tab active" data-tab="bg">Фон</button>
<button class="shop-tab" data-tab="pig">Свиньи</button>
<button class="shop-tab" data-tab="bird">Птицы</button>
<button class="shop-tab" data-tab="sling">Рогатка</button>
</div>
<div class="shop-list" id="shopList"></div>
<button id="shopBack" class="btn-ghost">← Назад</button>
</div></div>
</div>

function breakBlock(b){if(!b.alive)return;b.alive=false;for(var i=0;i<bodies.length;i++)if(bodies[i].alive&&!bodies[i].isStatic)wake(bodies[i]);burst(b.x,b.y,"#b9793f",15,"wood");burst(b.x,b.y,"#e2ad72",9,"wood");}
function killTarget(t){if(!t.alive||t.scored)return;burst(t.x,t.y,getSkin("pig").color,16);t.alive=false;t.scored=true;score+=100;addCoins(1);updateUI();}
function resolve(a,b,h){var nx=h.nx,ny=h.ny,sA=Math.hypot(a.vx,a.vy),sB=Math.hypot(b.vx,b.vy);if(a.sleeping&&sB>20)wake(a);if(b.sleeping&&sA>20)wake(b);var ia=(a.isStatic||a.sleeping)?0:1/a.mass,ib=(b.isStatic||b.sleeping)?0:1/b.mass,sum=ia+ib;if(!sum)return;var corr=Math.max(h.depth-0.25,0)*0.78/sum;if(ia){a.x-=nx*corr*ia;a.y-=ny*corr*ia;}if(ib){b.x+=nx*corr*ib;b.y+=ny*corr*ib;}var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;if(vn>=0)return;var e=Math.abs(vn)<35?0:Math.min(a.restitution,b.restitution),j=-(1+e)*vn/sum,ix=j*nx,iy=j*ny;if(ia){a.vx-=ix*ia;a.vy-=iy*ia;}if(ib){b.vx+=ix*ib;b.vy+=iy*ib;}var tx0=rvx-vn*nx,ty0=rvy-vn*ny,tl=Math.hypot(tx0,ty0);if(tl>0.001){var tx=tx0/tl,ty=ty0/tl,jt=-(rvx*tx+rvy*ty)/sum,mu=Math.sqrt(a.friction*b.friction),fj=Math.max(-j*mu,Math.min(j*mu,jt));if(ia){a.vx-=fj*tx*ia;a.vy-=fj*ty*ia;}if(ib){b.vx+=fj*tx*ib;b.vy+=fj*ty*ib;}}var imp=Math.abs(vn);var hb=(a.type==="projectile"&&b.type==="block")||(b.type==="projectile"&&a.type==="block");if(hb&&launched&&imp>28){if(a.type==="block")breakBlock(a);if(b.type==="block")breakBlock(b);}if(imp>95){if(a.type==="target")killTarget(a);if(b.type==="target")killTarget(b);}if(imp>25){wake(a);wake(b);}}
function ground(b){var bt=b.radius?b.y+b.radius:b.y+b.h/2;if(bt<=groundY)return;b.y-=bt-groundY;if(b.vy>0)b.vy=-b.vy*b.restitution;b.vx*=0.94;if(Math.abs(b.vy)<22)b.vy=0;if(Math.abs(b.vx)<3)b.vx=0;}
function sleepSys(b,dt){if(b.isStatic||(b===projectile&&dragging))return;var s=Math.hypot(b.vx,b.vy);if(s<8&&Math.abs(b.vy)<7){b.sleepTime+=dt;if(b.sleepTime>0.7){b.sleeping=true;b.vx=0;b.vy=0;}}else{b.sleepTime=0;b.sleeping=false;}}
function physics(dt){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;p.vy+=GRAVITY*.45*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==="wood"){p.rotation+=p.spin*dt;p.vx*=.995;}if(p.life<=0)particles.splice(i,1);}
for(var j=0;j<bodies.length;j++){var b=bodies[j];if(!b.alive||b.isStatic||b.sleeping)continue;if(b===projectile&&dragging)continue;b.vy+=GRAVITY*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;}
for(var k=0;k<SOLVER_ITERATIONS;k++){for(var i2=0;i2<bodies.length;i2++){var a=bodies[i2];if(!a.alive)continue;ground(a);for(var j2=i2+1;j2<bodies.length;j2++){var b2=bodies[j2];if(!b2.alive)continue;if(a===projectile&&dragging||b2===projectile&&dragging)continue;if(a.sleeping&&b2.sleeping)continue;var hit=getCol(a,b2);if(hit)resolve(a,b2,hit);}}}
for(var m=0;m<bodies.length;m++){var bb=bodies[m];if(!bb.alive)continue;ground(bb);sleepSys(bb,dt);if(bb.y>H+120||bb.x<-150||bb.x>W+150){if(bb.type==="target")killTarget(bb);else bb.alive=false;}}
bodies=bodies.filter(function(b){return b.alive;});
if(launched&&projectile&&projectile.alive){var sp=Math.hypot(projectile.vx,projectile.vy);if(sp<16)projectileStopTime+=dt;else projectileStopTime=0;if(projectileStopTime>0.75){projectile.alive=false;projectile=null;launched=false;projectileStopTime=0;if(attempts>0&&bodies.some(function(b){return b.type==="target";})){createProjectile();hintEl.textContent="Следующая птица готова!";}}}
checkLevel();}
function checkLevel(){if(overlay.style.display==="flex")return;var rem=bodies.some(function(b){return b.alive&&b.type==="target";});if(!rem){launched=false;dragging=false;var bonus=15;addCoins(bonus);hintEl.textContent="Уровень пройден!";overlayTitle.textContent="🏆 Победа!";overlayText.textContent="Уровень "+level+" пройден. +"+bonus+" монет!";overlayButton.textContent="Следующий уровень";overlay.style.display="flex";overlayButton.onclick=function(){overlay.style.display="none";level++;createLevel(false);};return;}
if(attempts<=0&&!launched&&!dragging){overlayTitle.textContent="Попытки закончились";overlayText.textContent="Уровень "+level+" не пройден.";overlayButton.textContent="Повторить";overlay.style.display="flex";overlayButton.onclick=function(){overlay.style.display="none";createLevel(false);};}}
function drawBG(){var s=getSkin("bg");var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,s.colors[0]);g.addColorStop(1,s.colors[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=s.ground;ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle=s.groundDark;ctx.fillRect(0,groundY,W,6);}
function drawSling(){var s=getSkin("sling"),x=sling.x,y=sling.y;ctx.save();ctx.lineCap="round";ctx.strokeStyle=s.color2;ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(x,y+55);ctx.bezierCurveTo(x-8,y+20,x-14,y-5,x-23,y-36);ctx.moveTo(x,y+55);ctx.bezierCurveTo(x+8,y+20,x+14,y-5,x+23,y-36);ctx.stroke();ctx.strokeStyle=s.color3;ctx.lineWidth=19;ctx.beginPath();ctx.moveTo(x,y+48);ctx.quadraticCurveTo(x-4,y+25,x,y+5);ctx.stroke();ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x-23,y-36,7,0,Math.PI*2);ctx.arc(x+23,y-36,7,0,Math.PI*2);ctx.fill();if(projectile&&!launched){ctx.strokeStyle="#3e2a1d";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-23,y-36);ctx.lineTo(projectile.x,projectile.y);ctx.moveTo(x+23,y-36);ctx.lineTo(projectile.x,projectile.y);ctx.stroke();}ctx.restore();}
function drawBlock(b){var x=b.x-b.w/2,y=b.y-b.h/2;ctx.fillStyle=b.color;ctx.fillRect(x,y,b.w,b.h);ctx.strokeStyle="#75421f";ctx.lineWidth=2;ctx.strokeRect(x,y,b.w,b.h);}
function drawTarget(b){var s=getSkin("pig");ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,b.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle=s.eye;ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-6,-4,4,0,Math.PI*2);ctx.arc(6,-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle=s.eye;ctx.beginPath();ctx.arc(-5,-3,2,0,Math.PI*2);ctx.arc(7,-3,2,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawBird(b){var s=getSkin("bird");ctx.save();ctx.translate(b.x,b.y);var g=ctx.createRadialGradient(-6,-8,2,0,0,b.radius+4);g.addColorStop(0,s.belly);g.addColorStop(.6,s.color);g.addColorStop(1,s.color2);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,b.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle=s.color2;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(-6,-3,5,0,Math.PI*2);ctx.arc(6,-3,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-5,-2,2.4,0,Math.PI*2);ctx.arc(7,-2,2.4,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawTraj(){if(!dragging||!projectile)return;var dx=sling.x-projectile.x,dy=sling.y-projectile.y,pl=Math.hypot(dx,dy),r=Math.min(pl/MAX_PULL,1),pw=1+r*.65,vx=dx*POWER*pw,vy=dy*POWER*pw;ctx.save();ctx.setLineDash([3,8]);ctx.lineWidth=2.5;ctx.strokeStyle="rgba(255,255,255,.92)";ctx.beginPath();for(var t=.06;t<=1.45;t+=.09){var x=projectile.x+vx*t,y=projectile.y+vy*t+.5*GRAVITY*t*t;if(y>groundY-10||x>W+20)break;ctx.lineTo(x,y);}ctx.stroke();ctx.restore();}
function drawPart(){for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function draw(){ctx.clearRect(0,0,W,H);drawBG();drawSling();drawTraj();for(var i=0;i<bodies.length;i++){var b=bodies[i];if(!b.alive||b===projectile)continue;if(b.type==="target")drawTarget(b);else drawBlock(b);}if(projectile&&projectile.alive)drawBird(projectile);drawPart();}
function loop(ts){if(!lastTime)lastTime=ts;var ft=Math.min((ts-lastTime)/1000,.05);lastTime=ts;accumulator+=ft;var st=0;while(accumulator>=FIXED_DT&&st<MAX_STEPS){physics(FIXED_DT);accumulator-=FIXED_DT;st++;}if(st===MAX_STEPS)accumulator=Math.min(accumulator,FIXED_DT);if(!inMenu)draw();requestAnimationFrame(loop);}
function openGame(){inMenu=false;menuScreen.classList.remove("show");shopScreen.classList.remove("show");resize();createLevel(true);}
function openMenu(){inMenu=true;menuScreen.classList.add("show");shopScreen.classList.remove("show");syncCoinsUI();}
function renderShop(tab){shopListEl.innerHTML="";for(var i=0;i<SKINS[tab].length;i++){var s=SKINS[tab][i],owned=save.unlocked[tab].indexOf(s.id)>=0,active=save.active[tab]===s.id,div=document.createElement("div");div.className="shop-item"+(active?" selected":"");var sw=document.createElement("div");sw.className="shop-swatch";if(tab==="bg")sw.style.background="linear-gradient(180deg,"+s.colors[0]+","+s.colors[1]+")";else if(tab==="pig"||tab==="bird")sw.style.background=s.color;else sw.style.background=s.color;var nm=document.createElement("div");nm.className="shop-name";nm.textContent=s.name;var btn=document.createElement("button");btn.className="shop-buy "+(active?"equipped":owned?"owned":"locked");btn.textContent=active?"✓ Выбрано":owned?"Выбрать":s.price+" 🪙";btn.disabled=active;btn.onclick=(function(sc,cat){return function(){if(save.unlocked[cat].indexOf(sc.id)<0){if(save.coins<sc.price){alert("Недостаточно монет!");return;}save.coins-=sc.price;save.unlocked[cat].push(sc.id);}save.active[cat]=sc.id;persistSave();syncCoinsUI();renderShop(tab);if(!inMenu)createLevel(false);};})(s,tab);div.appendChild(sw);div.appendChild(nm);div.appendChild(btn);shopListEl.appendChild(div);}}
shopTabsEl.onclick=function(e){var b=e.target.closest(".shop-tab");if(!b)return;var tabs=shopTabsEl.querySelectorAll(".shop-tab");for(var i=0;i<tabs.length;i++)tabs[i].classList.remove("active");b.classList.add("active");renderShop(b.getAttribute("data-tab"));};
playBtn.onclick=function(){openGame();};
shopBtn.onclick=function(){menuScreen.classList.remove("show");shopScreen.classList.add("show");renderShop("bg");syncCoinsUI();};
shopBack.onclick=function(){shopScreen.classList.remove("show");menuScreen.classList.add("show");syncCoinsUI();};
restartBtn.onclick=function(){level=1;if(inMenu)openGame();else createLevel(true);};
canvas.addEventListener("pointerdown",function(e){if(!projectile||launched||overlay.style.display==="flex")return;var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-projectile.x,y-projectile.y)<Math.max(58,projectile.radius+30)){dragging=true;pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);}});
canvas.addEventListener("pointermove",function(e){if(!dragging||!projectile||e.pointerId!==pointerId)return;var r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,dx=x-sling.x,dy=y-sling.y,md=Math.min(MAX_PULL,W*.35),d=Math.hypot(dx,dy);if(d>md){dx*=md/d;dy*=md/d;}dx=Math.min(dx,10);projectile.x=sling.x+dx;projectile.y=sling.y+dy;projectile.vx=0;projectile.vy=0;});
canvas.addEventListener("pointerup",function(e){if(e.pointerId!==pointerId||!dragging||!projectile)return;dragging=false;pointerId=null;var dx=sling.x-projectile.x,dy=sling.y-projectile.y,d=Math.hypot(dx,dy),r=Math.min(d/MAX_PULL,1),m=1+r*.65;projectile.vx=dx*POWER*m;projectile.vy=dy*POWER*m;launched=true;projectileStopTime=0;attempts=Math.max(0,attempts-1);updateUI();hintEl.textContent="Попади по всем целям!";});
canvas.addEventListener("pointercancel",function(e){if(e.pointerId===pointerId){dragging=false;pointerId=null;}});
window.addEventListener("resize",resize);
if(window.Telegram&&window.Telegram.WebApp){var tg=window.Telegram.WebApp;tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}
loadSave();syncCoinsUI();resize();requestAnimationFrame(loop);
})();
</script>
