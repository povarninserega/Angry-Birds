<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#62bce9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Slingshot Mini Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#83cffa;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#canvas:active{cursor:grabbing}
#ui{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:5;pointer-events:none}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.panel{padding:10px 13px;background:rgba(255,255,255,.94);border-radius:12px;color:#25364a;font-weight:bold;font-size:clamp(13px,3.5vw,17px);box-shadow:0 3px 12px #0002}
.bird-queue{display:inline-flex;gap:3px;vertical-align:middle;min-height:22px}
.bird-token{font-size:20px;line-height:1;filter:drop-shadow(0 1px 1px #0003)}
button{pointer-events:auto;background:#ff7043;color:white;border:0;padding:11px 15px;border-radius:12px;font-size:14px;font-weight:bold;box-shadow:0 3px 8px #0002;cursor:pointer;font-family:inherit}
button:active{transform:scale(.97)}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;color:white;font-weight:bold;font-size:14px;text-shadow:0 2px 5px #333;pointer-events:none;z-index:4}
#overlay{display:none;position:absolute;inset:0;z-index:10;background:rgba(12,30,45,.35);align-items:center;justify-content:center;padding:20px}
#overlayCard{background:white;border-radius:20px;padding:24px;text-align:center;max-width:340px;width:100%;box-shadow:0 12px 35px #0003}
#overlayTitle{font-size:25px;color:#25364a;margin-bottom:10px}
#overlayText{color:#526273;margin-bottom:18px;line-height:1.4}
#overlay button{font-size:16px;padding:13px 22px}

/* ==== Меню и магазин ==== */
.screen{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,#8fd4ff,#d9f4ff 65%,#b7ecb0)}
.screen.show{display:flex}
.menu-card,.shop-card{background:rgba(255,255,255,.96);border-radius:24px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 16px 45px #0003;text-align:center;max-height:calc(100dvh - 36px);display:flex;flex-direction:column}
.menu-logo{font-size:clamp(34px,10vw,54px);line-height:1;margin-bottom:6px}
.menu-title{font-size:clamp(22px,6vw,30px);color:#25364a;font-weight:900;letter-spacing:.5px;margin-bottom:4px}
.menu-sub{color:#6c7d90;font-weight:bold;margin-bottom:18px;font-size:14px}
.menu-coins{display:inline-flex;align-items:center;gap:7px;background:#fff7d6;border:2px solid #ffd54f;color:#a8720b;font-weight:900;border-radius:14px;padding:8px 16px;margin-bottom:20px;font-size:17px;align-self:center}
.menu-buttons{display:flex;flex-direction:column;gap:11px}
.btn-primary{background:linear-gradient(180deg,#ff8a5c,#ff5f34);font-size:19px;padding:16px}
.btn-secondary{background:linear-gradient(180deg,#57bdf1,#2f9ad6);font-size:17px;padding:14px}
.btn-ghost{background:#e8eef4;color:#3d4d5e;box-shadow:none;font-size:15px;padding:12px}
.shop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.shop-head h2{font-size:21px;color:#25364a}
.shop-coins{background:#fff7d6;border:2px solid #ffd54f;color:#a8720b;font-weight:900;border-radius:12px;padding:6px 12px;font-size:15px}
.shop-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.shop-tab{background:#e8eef4;color:#3d4d5e;box-shadow:none;padding:8px 10px;font-size:12.5px;border-radius:10px;flex:1;min-width:70px}
.shop-tab.active{background:#25364a;color:#fff}
.shop-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;overflow-y:auto;padding:2px;margin-bottom:14px;flex:1;min-height:120px}
.shop-item{background:#f4f8fc;border:2px solid #dce7f0;border-radius:14px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shop-item.selected{border-color:#3ec44c;background:#eefbf0}
.shop-swatch{width:100%;height:44px;border-radius:10px;border:1px solid #0002;display:flex;align-items:center;justify-content:center;font-size:24px}
.shop-name{font-size:12.5px;font-weight:bold;color:#25364a;line-height:1.15}
.shop-buy{font-size:12px;padding:7px 10px;border-radius:9px;width:100%}
.shop-buy.owned{background:#cfe9d2;color:#2c7a34;box-shadow:none}
.shop-buy.equipped{background:#3ec44c}
.shop-buy.locked{background:#ffb300}
.shop-buy:disabled{opacity:.55}
</style>
</head>
<body>
<div id="game">
  <div id="ui">
    <div class="stats">
      <div class="panel">🪙 <span id="coins">0</span></div>
      <div class="panel">⭐ <span id="score">0</span></div>
      <div class="panel">Уровень: <span id="level">1</span></div>
      <div class="panel">Птицы: <span id="birdQueue" class="bird-queue"></span></div>
    </div>
    <button id="restart">↻ Заново</button>
  </div>
  <canvas id="canvas"></canvas>
  <div id="hint">Оттяни снаряд назад и отпусти!</div>

  <div id="overlay">
    <div id="overlayCard">
      <div id="overlayTitle">Уровень пройден!</div>
      <div id="overlayText">Отличный результат!</div>
      <button id="overlayButton">Следующий уровень</button>
    </div>
  </div>

  <div id="menuScreen" class="screen show">
    <div class="menu-card">
      <div class="menu-logo">🐦🎯</div>
      <div class="menu-title">SLINGSHOT</div>
      <div class="menu-sub">Рогатка · Свинки · Скины</div>
      <div class="menu-coins">🪙 <span id="menuCoins">0</span></div>
      <div class="menu-buttons">
        <button id="playBtn" class="btn-primary">▶ Играть</button>
        <button id="shopBtn" class="btn-secondary">🛒 Магазин</button>
      </div>
    </div>
  </div>

  <div id="shopScreen" class="screen">
    <div class="shop-card">
      <div class="shop-head">
        <h2>Магазин</h2>
        <div class="shop-coins">🪙 <span id="shopCoins">0</span></div>
      </div>
      <div class="shop-tabs" id="shopTabs">
        <button class="shop-tab active" data-tab="bg">Фон</button>
        <button class="shop-tab" data-tab="pig">Свиньи</button>
        <button class="shop-tab" data-tab="bird">Птицы</button>
        <button class="shop-tab" data-tab="sling">Рогатка</button>
      </div>
      <div class="shop-list" id="shopList"></div>
      <button id="shopBack" class="btn-ghost">← Назад в меню</button>
    </div>
  </div>
</div>
<script>
(() => {
"use strict";

/* ========== DOM ========== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {alpha:false});
const scoreEl = document.getElementById("score");
const levelEl = document.getElementById("level");
const coinsEl = document.getElementById("coins");
const birdQueueEl = document.getElementById("birdQueue");
const hintEl = document.getElementById("hint");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const overlayButton = document.getElementById("overlayButton");
const menuScreen = document.getElementById("menuScreen");
const shopScreen = document.getElementById("shopScreen");
const menuCoinsEl = document.getElementById("menuCoins");
const shopCoinsEl = document.getElementById("shopCoins");
const shopListEl = document.getElementById("shopList");
const shopTabsEl = document.getElementById("shopTabs");
const playBtn = document.getElementById("playBtn");
const shopBtn = document.getElementById("shopBtn");
const shopBack = document.getElementById("shopBack");
const restartBtn = document.getElementById("restart");

/* ========== СКИНЫ ========== */
const SKINS = {
  bg: [
    {id:"bg_default", name:"День", price:0, preview:{type:"sky", colors:["#62bce9","#d4f2ff"], ground:"#5cad42", groundDark:"#367c2c"}},
    {id:"bg_sunset",  name:"Закат", price:40, preview:{type:"sky", colors:["#ff9a5c","#ffe6a7"], ground:"#7a9a3a", groundDark:"#4d6b23"}},
    {id:"bg_night",   name:"Ночь",  price:60, preview:{type:"sky", colors:["#1b2a54","#4b6bb5"], ground:"#2f4a5a", groundDark:"#1d313c"}},
    {id:"bg_forest",  name:"Лес",   price:50, preview:{type:"sky", colors:["#9fe0b0","#e6f9df"], ground:"#4f9a3c", groundDark:"#316b26"}},
    {id:"bg_desert",  name:"Пустыня",price:70, preview:{type:"sky", colors:["#ffd27a","#fff2cf"], ground:"#d9b25e", groundDark:"#a8842f"}}
  ],
  pig: [
    {id:"pig_default", name:"Классик", price:0, color:"#56d64e", eye:"#237a29", cheek:"#f28c9a"},
    {id:"pig_blue",    name:"Синий",   price:25, color:"#4fa8ff", eye:"#1b4f7a", cheek:"#8fc4f0"},
    {id:"pig_purple",  name:"Фиолет",  price:35, color:"#b06bff", eye:"#5a2c7a", cheek:"#d5aef0"},
    {id:"pig_orange",  name:"Апельсин",price:45, color:"#ff9b3d", eye:"#9a5200", cheek:"#ffd08a"}
  ],
  bird: [
    {id:"bird_default", name:"Красная", price:0, color:"#f04435", color2:"#b91f25", belly:"#ff9a72"},
    {id:"bird_blue",    name:"Синяя",   price:25, color:"#3f8cff", color2:"#1f4fb9", belly:"#8fc1ff"},
    {id:"bird_yellow",  name:"Жёлтая",  price:35, color:"#ffd23f", color2:"#c99a00", belly:"#fff0a8"},
    {id:"bird_green",   name:"Зелёная", price:45, color:"#5bd45b", color2:"#2c8a2c", belly:"#b3f0a8"}
  ],
  sling: [
    {id:"sling_default", name:"Дерево", price:0, color:"#bd8146", color2:"#80502b", color3:"#4b2a17"},
    {id:"sling_dark",    name:"Тёмное", price:25, color:"#8a6b4a", color2:"#4d3520", color3:"#2e1d0f"},
    {id:"sling_metal",   name:"Металл", price:45, color:"#c8d2dc", color2:"#7a8794", color3:"#4a545e"},
    {id:"sling_gold",    name:"Золото", price:70, color:"#ffe08a", color2:"#c99b1a", color3:"#8a6508"}
  ]
};
const SAVE_DEFAULT = {bg:"bg_default", pig:"pig_default", bird:"bird_default", sling:"sling_default"};

/* ========== СОХРАНЕНИЕ ========== */
const SAVE_KEY = "slingshot_save_v2";
const save = {
  coins: 0,
  unlocked: {bg:["bg_default"], pig:["pig_default"], bird:["bird_default"], sling:["sling_default"]},
  active:   {bg:"bg_default", pig:"pig_default", bird:"bird_default", sling:"sling_default"}
};
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && typeof d==="object"){
        if(typeof d.coins==="number") save.coins=d.coins;
        if(d.unlocked) for(const k of Object.keys(save.unlocked)) if(Array.isArray(d.unlocked[k])) save.unlocked[k]=d.unlocked[k];
        if(d.active) for(const k of Object.keys(save.active)) if(typeof d.active[k]==="string") save.active[k]=d.active[k];
      }
    }
  }catch(e){}
  for(const cat of Object.keys(save.unlocked)){
    if(!save.unlocked[cat].includes(SAVE_DEFAULT[cat])) save.unlocked[cat].push(SAVE_DEFAULT[cat]);
    if(!save.unlocked[cat].includes(save.active[cat])) save.active[cat]=SAVE_DEFAULT[cat];
  }
}
function persistSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
function getSkin(cat){
  const id = save.active[cat];
  return SKINS[cat].find(s=>s.id===id) || SKINS[cat][0];
}
function isUnlocked(cat,id){ return save.unlocked[cat].includes(id); }
function addCoins(n){ save.coins += n; persistSave(); syncCoinsUI(); }
function syncCoinsUI(){
  coinsEl.textContent = save.coins;
  menuCoinsEl.textContent = save.coins;
  shopCoinsEl.textContent = save.coins;
}

/* ========== СОСТОЯНИЕ ========== */
let W=0,H=0,DPR=1,groundY=0;
let bodies=[],projectile=null;
let score=0,level=1,attempts=5,maxAttempts=5;
let dragging=false,launched=false,pointerId=null,projectileStopTime=0;
let sling={x:100,y:300};
let lastTime=0,accumulator=0,animationTime=0;
let levelCoinsEarnedThisLevel=0;
let inMenu=true;
const particles=[];

const GRAVITY=1450;
const POWER=12;
const MAX_PULL=155;
const FIXED_DT=1/120;
const MAX_STEPS=6;
const SOLVER_ITERATIONS=7;

/* ========== UI ========== */
function updateUI(){
  scoreEl.textContent=score;
  levelEl.textContent=level;
  birdQueueEl.innerHTML=Array.from({length:attempts},()=>'<span class="bird-token">🐦</span>').join("") || "—";
  syncCoinsUI();
}

/* ========== ФИЗИКА ========== */
function createBody(x,y,w,h,opt={}){
  const b={x,y,px:x,py:y,vx:0,vy:0,w,h,radius:opt.radius||0,
    type:opt.type||"block",color:opt.color||"#b9793f",mass:opt.mass||1,
    restitution:opt.restitution??0.05,friction:opt.friction??0.8,
    alive:true,sleeping:false,sleepTime:0,isStatic:!!opt.isStatic,scored:false};
  bodies.push(b);
  return b;
}
function createProjectile(){
  projectileStopTime=0;
  projectile=createBody(sling.x,sling.y,36,36,{
    type:"projectile",radius:18,color:getSkin("bird").color,
    mass:1.5,restitution:0.38,friction:0.65
  });
}

/* ========== УРОВНИ ========== */
function buildLevel(n){
  const baseX = Math.min(W*0.73, W-110);
  const baseY = groundY;
  const diff = Math.min(n-1, 9);
  const bw = Math.min(36, W*0.085);
  const bh = 80 + diff*2;
  const blockColor = diff>=6 ? "#9b6338" : (diff>=3 ? "#a06a3c" : "#b9793f");
  const darkColor = "#8f5b35";
  const block=(x,y,w,h,extra={})=>createBody(x,y,w,h,Object.assign({color:blockColor,mass:1.1+diff*0.1},extra));
  const pig=(x,y)=>createBody(x,y,36,36,{type:"target",radius:18,color:getSkin("pig").color,mass:0.7+diff*0.06,restitution:0.12,friction:0.75});

  const layouts = [
    // 0
    ()=>{
      block(baseX-48,baseY-42,bw,bh); block(baseX+48,baseY-42,bw,bh);
      block(baseX,baseY-92,125,16);
      block(baseX-48,baseY-150,bw,60); block(baseX+48,baseY-150,bw,60);
      block(baseX,baseY-190,125,16);
      pig(baseX,baseY-120); pig(baseX-48,baseY-180); pig(baseX+48,baseY-180);
    },
    // 1
    ()=>{
      block(baseX-70,baseY-42,bw,bh); block(baseX+70,baseY-42,bw,bh);
      block(baseX,baseY-92,180,16);
      block(baseX-40,baseY-140,bw,70); block(baseX+40,baseY-140,bw,70);
      block(baseX,baseY-185,120,16);
      pig(baseX,baseY-120); pig(baseX-60,baseY-170); pig(baseX+60,baseY-170); pig(baseX,baseY-215);
    },
    // 2
    ()=>{
      block(baseX-55,baseY-42,bw,bh); block(baseX,baseY-42,bw,bh); block(baseX+55,baseY-42,bw,bh);
      block(baseX,baseY-92,200,16);
      block(baseX-45,baseY-145,bw,80); block(baseX+45,baseY-145,bw,80);
      block(baseX,baseY-195,140,16);
      pig(baseX-55,baseY-120); pig(baseX+55,baseY-120); pig(baseX,baseY-230); pig(baseX,baseY-270);
    },
    // 3
    ()=>{
      block(baseX-90,baseY-42,bw,bh); block(baseX-30,baseY-42,bw,bh);
      block(baseX+30,baseY-42,bw,bh); block(baseX+90,baseY-42,bw,bh);
      block(baseX,baseY-92,240,16);
      block(baseX-70,baseY-145,bw,80); block(baseX+70,baseY-145,bw,80);
      block(baseX,baseY-195,180,16);
      block(baseX-40,baseY-240,bw,60); block(baseX+40,baseY-240,bw,60);
      block(baseX,baseY-280,140,16);
      pig(baseX-60,baseY-120); pig(baseX+60,baseY-120); pig(baseX,baseY-230); pig(baseX,baseY-310);
    },
    // 4
    ()=>{
      block(baseX-100,baseY-42,bw,bh); block(baseX+100,baseY-42,bw,bh);
      block(baseX,baseY-92,260,16);
      block(baseX-60,baseY-145,bw,80); block(baseX+60,baseY-145,bw,80);
      block(baseX,baseY-195,160,16);
      block(baseX,baseY-240,16,80);
      pig(baseX-80,baseY-120); pig(baseX+80,baseY-120); pig(baseX,baseY-230);
      pig(baseX-40,baseY-270); pig(baseX+40,baseY-270);
    },
    // 5
    ()=>{
      block(baseX-110,baseY-42,bw,bh); block(baseX-60,baseY-42,bw,bh);
      block(baseX+60,baseY-42,bw,bh); block(baseX+110,baseY-42,bw,bh);
      block(baseX-85,baseY-92,120,16); block(baseX+85,baseY-92,120,16);
      block(baseX-85,baseY-145,bw,80); block(baseX+85,baseY-145,bw,80);
      block(baseX-85,baseY-195,90,16); block(baseX+85,baseY-195,90,16);
      pig(baseX-85,baseY-120); pig(baseX+85,baseY-120); pig(baseX-85,baseY-225); pig(baseX+85,baseY-225); pig(baseX,baseY-120);
    },
    // 6
    ()=>{
      block(baseX-55,baseY-42,bw,bh); block(baseX+55,baseY-42,bw,bh);
      block(baseX,baseY-92,150,16);
      block(baseX-55,baseY-150,bw,bh); block(baseX+55,baseY-150,bw,bh);
      block(baseX,baseY-200,150,16);
      block(baseX-55,baseY-258,bw,bh); block(baseX+55,baseY-258,bw,bh);
      block(baseX,baseY-308,150,16);
      pig(baseX,baseY-120); pig(baseX,baseY-228); pig(baseX,baseY-336); pig(baseX-30,baseY-336); pig(baseX+30,baseY-336);
    },
    // 7
    ()=>{
      block(baseX,baseY-42,16,160);
      block(baseX-70,baseY-42,bw,bh); block(baseX+70,baseY-42,bw,bh);
      block(baseX,baseY-130,200,16);
      block(baseX-60,baseY-190,bw,90); block(baseX+60,baseY-190,bw,90);
      block(baseX,baseY-245,170,16);
      pig(baseX-50,baseY-170); pig(baseX+50,baseY-170); pig(baseX,baseY-280); pig(baseX-30,baseY-310); pig(baseX+30,baseY-310);
    },
    // 8
    ()=>{
      block(baseX-100,baseY-42,bw,bh); block(baseX+100,baseY-42,bw,bh);
      block(baseX,baseY-100,260,16);
      block(baseX-70,baseY-160,bw,90); block(baseX+70,baseY-160,bw,90);
      block(baseX,baseY-220,180,16);
      block(baseX-40,baseY-275,bw,70); block(baseX+40,baseY-275,bw,70);
      block(baseX,baseY-320,120,16);
      pig(baseX,baseY-140); pig(baseX,baseY-250); pig(baseX,baseY-350); pig(baseX-60,baseY-350); pig(baseX+60,baseY-350);
    },
    // 9
    ()=>{
      block(baseX-120,baseY-42,bw,bh); block(baseX-40,baseY-42,bw,bh);
      block(baseX+40,baseY-42,bw,bh); block(baseX+120,baseY-42,bw,bh);
      block(baseX,baseY-92,300,16);
      block(baseX-100,baseY-150,bw,bh); block(baseX,baseY-150,bw,bh); block(baseX+100,baseY-150,bw,bh);
      block(baseX,baseY-210,280,16);
      block(baseX-70,baseY-270,bw,90); block(baseX+70,baseY-270,bw,90);
      block(baseX,baseY-330,180,16);
      block(baseX,baseY-370,16,70);
      pig(baseX-80,baseY-120); pig(baseX+80,baseY-120); pig(baseX-100,baseY-240); pig(baseX+100,baseY-240); pig(baseX,baseY-240); pig(baseX-30,baseY-390); pig(baseX+30,baseY-390);
    }
  ];

  layouts[(n-1)%layouts.length]();

  if(n>=4){
    createBody(baseX-110,baseY-92,14,92,{color:darkColor,mass:1.4+diff*.1});
    createBody(baseX+110,baseY-92,14,92,{color:darkColor,mass:1.4+diff*.1});
  }
  if(n>=7){
    createBody(baseX,baseY-238,100,14,{color:darkColor,mass:1.7+diff*.12});
  }
}

function createLevel(resetScore=false){
  groundY=H-48;
  sling.x=Math.max(78,W*0.17);
  sling.y=groundY-66;
  bodies=[];
  dragging=false; launched=false; pointerId=null; projectile=null;
  attempts=Math.max(2,6-level);
  maxAttempts=attempts;
  if(resetScore) score=0;
  levelCoinsEarnedThisLevel=0;
  overlay.style.display="none";
  buildLevel(level);
  createProjectile();
  hintEl.textContent="Оттяни птицу — увидишь траекторию полёта!";
  updateUI();
}

/* ========== RESIZE ========== */
function resize(){
  const oldW=W, oldH=H;
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;
  if(oldW && oldH){ if(!inMenu) createLevel(false); }
  else { if(!inMenu) createLevel(true); }
}

function wake(b){ if(!b||b.isStatic)return; b.sleeping=false; b.sleepTime=0; }
function circleCircle(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.radius+b.radius;
  if(d>=min||d<0.0001)return null;
  return {nx:dx/d,ny:dy/d,depth:min-d};
}
function rectRect(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const ox=(a.w+b.w)/2-Math.abs(dx), oy=(a.h+b.h)/2-Math.abs(dy);
  if(ox<=0||oy<=0)return null;
  return ox<oy?{nx:dx>=0?1:-1,ny:0,depth:ox}:{nx:0,ny:dy>=0?1:-1,depth:oy};
}
function circleRect(c,r){
  const left=r.x-r.w/2,right=r.x+r.w/2,top=r.y-r.h/2,bottom=r.y+r.h/2;
  const px=Math.max(left,Math.min(right,c.x)), py=Math.max(top,Math.min(bottom,c.y));
  let dx=c.x-px,dy=c.y-py; const d=Math.hypot(dx,dy);
  if(d>=c.radius)return null;
  if(d<0.0001){
    const toL=c.x-left,toR=right-c.x,toT=c.y-top,toB=bottom-c.y;
    const m=Math.min(toL,toR,toT,toB);
    if(m===toL)return {nx:1,ny:0,depth:c.radius+toL};
    if(m===toR)return {nx:-1,ny:0,depth:c.radius+toR};
    if(m===toT)return {nx:0,ny:1,depth:c.radius+toT};
    return {nx:0,ny:-1,depth:c.radius+toB};
  }
  return {nx:-dx/d,ny:-dy/d,depth:c.radius-d};
}
function getCollision(a,b){
  if(a.radius&&b.radius)return circleCircle(a,b);
  if(!a.radius&&!b.radius)return rectRect(a,b);
  if(a.radius)return circleRect(a,b);
  const hit=circleRect(b,a); if(hit){hit.nx*=-1;hit.ny*=-1;} return hit;
}

    const a=Math.random()*Math.PI*2, speed=70+Math.random()*210;
    particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-50,
      life:.45+Math.random()*.45,maxLife:.9,size:2+Math.random()*4,color,
      kind,rotation:Math.random()*Math.PI,spin:(Math.random()-.5)*9});
  }
}
function breakWoodBlock(block){
  if(!block.alive)return;
  block.alive=false;
  for(const body of bodies) if(body.alive&&!body.isStatic) wake(body);
  burstParticles(block.x,block.y,"#b9793f",15,"wood");
  burstParticles(block.x,block.y,"#e2ad72",9,"wood");
}
function destroyTarget(t){
  if(!t.alive||t.scored)return;
  burstParticles(t.x,t.y,getSkin("pig").color,16);
  t.alive=false; t.scored=true;
  score+=100;
  addCoins(1);
  levelCoinsEarnedThisLevel+=1;
  updateUI();
}
